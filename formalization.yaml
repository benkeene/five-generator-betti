known_gaps:
  - "leanchecker --fresh not run (optional; the Linux CI comparator with NanoDa/con-ron passed at 0223cfc, and the reviewer re-ran the exported-closure replay of F, leanexport | leanchecker --from-export, exit 0)."
  - "The two packaging records of 2026-10-17 (familyGens_minimallyGenerates, family_presentation) postdate the formal adversary and reviewer passes, which saw family_spanRank_eq alone; they are thin calls into library declarations those passes covered, and the CI comparator passed with all three at 0a897c8."
  - "The reverse fiber bridge (betaFiber <= spanRank) is not formalized; it is not needed for F, which does not assert equality with betaFiber."
  - "The finite-width theorem is unproved; periodicity and exhaustive replay are out of version 1."

limitations:
  - "No novelty claim is made; the family's novelty confidence is 0.70 after a literature audit."
  - "FiveGenBetti/AxiomAudit.lean is informational: #print axioms does not fail on unexpected axioms and the audit is not run in CI; only the comparator enforces the axiom allowance."
  - "Examples/Thirteen.lean specialises F at (k,q) = (3,2); it is not an independent computation of the rank."

alignment:
  namespace: "FiveGenBetti"
  statements:
    - source: "Theorem F: beta1 = 4k+2 for <m, m+1, m+k, m+2k-1, m+2k>, m = 2kq+1, k >= 3, q >= k-1"
      lean: "FiveGenBetti.family_spanRank_eq"
    - source: "Theorem F, presentation form: the 2k+2 relations H and 2k relations N generate the toric ideal, none is redundant, and there are 4k+2 of them"
      lean: "FiveGenBetti.family_presentation"
    - source: "The generators m, m+1, m+k, m+2k-1, m+2k minimally generate their numerical semigroup (so S is minimally five-generated of width 2k)"
      lean: "FiveGenBetti.familyGens_minimallyGenerates"
    - source: "Theorem W (conjecture): beta1 <= 2w+2 for minimally five-generated S with 4 <= w <= 40"
      lean: "FiveGenBetti.beta1_five_le_two_width_add_two"
