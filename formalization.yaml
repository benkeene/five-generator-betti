# formalization.yaml v0.4 — adopted from https://github.com/mathlib-initiative/formalization.yaml
version: "v0.4"

project:
  name: "First Betti numbers of five-generated numerical semigroups"
  description: >-
    A Lean 4 / Mathlib formalization project for (F) an explicit two-parameter family of
    minimally five-generated numerical semigroups <m, m+1, m+k, m+2k-1, m+2k>, m = 2kq+1,
    whose toric ideal has spanRank exactly 4k+2. Planned scope for (W), a proposed finite-width
    bound beta1 <= 2w+2 (4 <= w <= 40), not all formalized: the generic fiber-graph
    infrastructure, both algebraic bridges (only the upper bridge is formalized; the reverse
    bridge is not), the corrected singleton-counting decomposition beta1 + p = 5 + N, the
    pair-component antichain lemma and certificate-checker soundness (not yet written). Version 1
    targets F; W is stated and excluded from the release comparator. F is sorry-free at b0a3671.
  authors:
    - "Ben Keene"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ben Keene"

repository:
  role: substantive-development

classification:
  arxiv: [math.AC, math.CO]
  msc2020: ["13D02", "20M14", "13F65", "05E40"]

status:
  scope: >-
    Theorem F (2026-10-16, commit of record b0a3671): sorry-free Lean development,
    kernel-replayed locally (literal 23-module leanchecker replay at 0a2a156, whose Lean
    sources differ from b0a3671 only in Solution.lean comments). Astra reviewer pass 1 on the
    formal development (2026-10-17): ACCEPT_WITH_FIXES 0.98; the reviewer judges that F
    qualifies for FORMALLY_VERIFIED under aiseminar AGENTS.md section 3. Independent statement
    reconstruction done and checked equivalent in Lean (CORRESPONDENCE.md section 13). The lab
    status is still VERIFIED until the promotion step is recorded; CI comparator not run. Informally, F is an ordinary theorem by the laboratory's review
    protocol (docs/PROOF.md, aiseminar claim_0005). Theorem W is a conjecture, admitted in
    Targets/FiniteWidth.lean, outside Solution's import closure and outside defaultTargets.
    sorry_count convention: occurrences of `sorry` outside Challenge.lean (whose two
    statement-of-record placeholders are deliberate) in the default build targets
    (FiveGenBetti, Challenge, Solution) = 0; Targets/FiniteWidth.lean (W) has one admitted
    `sorry`, excluded from this count. The axioms list is that of the main result
    FiveGenBetti.family_spanRank_eq imported from Solution. Formal periodicity and the
    complete width-40 replay are outside version 1.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - "FiveGenBetti.family_spanRank_eq"

fidelity:
  divergences: >-
    The statements use cardinal-valued Submodule.spanRank of the toric ideal
    ker(K[X0..X4] -> K[t], Xi |-> t^(n i)). Equality with the factorization-fiber invariant
    requires a reverse bridge not present in the four-generator template. Nonredundancy of the
    displayed family presentation is intended; indispensability of every generator is not
    claimed (N_0 can be exchanged for b e^q - a^(q+2)). The finite-width target is unproved.

sources:
  - title: "Linear first-Betti bounds for five-generated numerical semigroups (proof attempt, unpublished)"
    authors: ["Ben Keene"]
    type: "original-proof"
    relationship: other
    note: >-
      Informal presentation and minimality argument produced by GPT-6 Astra (2026-10-16,
      docs/astra/); the informal proof has since passed the full aiseminar review protocol
      (claim_0005, VERIFIED as an ordinary theorem, 2026-10-16).
  - title: "Minimal presentations of shifted numerical monoids"
    authors: ["Rebecca Conaway", "Felix Gotti", "Jesse Horton", "Christopher O'Neill", "Roberto Pelayo", "Mesa Pracht", "Brian Wissman"]
    type: "article"
    id: "https://doi.org/10.1142/S0218196718500030"
    relationship: background
    note: "Theorem 4.9: cardinality-preserving bijection of minimal presentations for m > w^2 (periodicity window w^2 < m <= w^2 + w)."
  - title: "Bounds for syzygies of monomial curves"
    authors: ["Giulio Caviglia", "Alessio Moscariello", "Alessio Sammartano"]
    type: "article"
    id: "https://doi.org/10.1090/proc/16862"
    relationship: background
    note: "The quadratic width conjecture and its proof in embedding dimension four for width >= 40."

related_formalizations:
  - id: "https://palomar-registry.org/entry?id=PALOMAR-2026-10-07-000005&version=1"
    relationship: other
    note: >-
      Four-generator case beta1 <= 2w: template for layout and verification, and source
      library generalized here (docs/PORTING.md records reused files and the source commit
      aa266b8a7db2794e49a0053978852ade100d23da).

automation:
  methods:
    - method: agent
      models: ["GPT-6 Astra (OpenAI)", "Claude Fable 5.1 (Anthropic)"]
      framework: "Codex app-server (for GPT-6 Astra); Claude Code"
      tool_setup: >-
        GPT-6 Astra as independent prover, adversarial reviewer and read-only repository
        auditor; Claude Code writing the Lean scaffold against a pinned local toolchain.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine (Apple silicon Mac) plus subscription model access"
      prompting_notes: "Astra role prompts; never told a proposed argument was probably right."
  spend_usd: "subscription-based"
  notes: >-
    Agent agreement is not evidence; theorem status follows the aiseminar review protocol.

review:
  status: self-assessed
  reviewers:
    - "Ben Keene"
    - "GPT-6 Astra (adversary, reviewer, independent prover; four passes on the informal proof, 2026-10-16)"
    - "GPT-6 Astra (adversary 'meaning' and 'trust' on the formal development at b0a3671, 2026-10-16)"
    - "GPT-6 Astra (reviewer-formal pass 1 at 4c9349b, and independent statement reconstruction, 2026-10-17)"
  notes: >-
    The informal proof of Theorem F passed an adversary pass (objections answered), a reviewer
    pass (fixes applied), an independent reconstruction from the statement alone, and a
    confirming reviewer pass that replayed the 32 in-range small instances and their
    presentation checks (aiseminar experiments/local/2026-10-16_semigroup_e5_family_tests).
    No external human review. Formal development: adversary passes 'meaning' and 'trust'
    (2026-10-16, aiseminar agents/astra/transcripts/20261016T234404_adversary-*_claim_0005.md),
    both ACCEPT_WITH_FIXES 0.97, no mathematical counterexample or verification-chain escape;
    their documentation/provenance fixes were applied in 956ab8d and 4c9349b, except the
    stale header of the frozen Challenge.lean and the Linux comparator request. Reviewer pass 1
    (2026-10-17, aiseminar agents/astra/transcripts/20261017T000811_reviewer-formal_claim_0005.md):
    ACCEPT_WITH_FIXES 0.98, no mathematical gap; its documentation fixes (byte-identity record,
    replay record, minimality exposition, scope and status wording) are applied in the commit
    following 0a2a156. Independent statement reconstruction (20261017T000811_statement-recon):
    checked equivalent in Lean (CORRESPONDENCE.md section 13). Kernel replay, literal:
    "lake env leanchecker FiveGenBetti Challenge Solution FiveGenBetti.Algebra FiveGenBetti.Bridge FiveGenBetti.Certificate.Defs FiveGenBetti.Defs FiveGenBetti.Examples.Thirteen FiveGenBetti.Family.Apery FiveGenBetti.Family.Data FiveGenBetti.Family.Defs FiveGenBetti.Family.Generation FiveGenBetti.Family.Lemmas FiveGenBetti.Family.Main FiveGenBetti.Family.Minimality FiveGenBetti.Family.NormalForms FiveGenBetti.Family.Relations FiveGenBetti.Fiber FiveGenBetti.Graded.Indecomposables FiveGenBetti.Graded.Projection FiveGenBetti.GradedGenerators FiveGenBetti.Interface FiveGenBetti.Main" (23 modules: umbrella FiveGenBetti, Challenge, Solution and the 20 FiveGenBetti.* modules with oleans; AxiomAudit and Targets.FiniteWidth have none) at 0a2a156, exit 0, 569 s wall (two earlier identical attempts were SIGKILLed, rc 137, not counted). The 2026-10-16 record "all 22 built modules ... 13 min 19 s" at b0a3671 did not
    retain its literal argv and is superseded. The nine Minimality proofs were produced by GPT-6
